<script>
    const areaCenter = {
        lat: {{ area_center['lat'] }},
        lng: {{ area_center['lng'] }},
        label: {{ area_center['label']|tojson }}
    };

    const spots = [
        {% for spot in spots %}
        {
            zone_name: {{ spot['zone_name']|tojson }},
            section_code: {{ spot['section_code']|tojson }},
            spot_code: {{ spot['spot_code']|tojson }},
            is_free: {{ spot['is_free'] }},
            lat: {{ spot['latitude'] }},
            lng: {{ spot['longitude'] }}
        }{% if not loop.last %},{% endif %}
        {% endfor %}
    ];

    const map = L.map('map').setView([areaCenter.lat, areaCenter.lng], 19);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const bounds = [];

    const centerMarker = L.marker([areaCenter.lat, areaCenter.lng]).addTo(map);
    centerMarker.bindPopup(`<strong>${areaCenter.label}</strong>`);

    spots.forEach(spot => {
        const color = spot.is_free === 1 ? "#16a34a" : "#ef4444";

        const marker = L.circleMarker([spot.lat, spot.lng], {
            radius: 8,
            fillColor: color,
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.95
        }).addTo(map);

        const popupText = `
            <div style="min-width:160px;">
                <strong>${spot.spot_code}</strong><br>
                Zone: ${spot.zone_name}<br>
                Section: ${spot.section_code}<br>
                Status: ${spot.is_free === 1 ? "Free" : "Occupied"}
            </div>
        `;

        marker.bindPopup(popupText);
        bounds.push([spot.lat, spot.lng]);
    });

    if (bounds.length > 0) {
        bounds.push([areaCenter.lat, areaCenter.lng]);
        map.fitBounds(bounds, { padding: [30, 30] });
    }
</script>
