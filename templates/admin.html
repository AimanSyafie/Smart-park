<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Reports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-body">
    <header class="top-bar">
        <h1>Admin Reports</h1>
        <a href="{{ url_for('home') }}" class="back-btn">← Back</a>
    </header>

    <section class="admin-section">
        <h2>Submitted XML Reports</h2>

        {% for report in reports %}
        <div class="report-card">
            <p><strong>Area:</strong> {{ report["area"] }}</p>
            <p><strong>Spot:</strong> {{ report["spot_code"] }}</p>
            <p><strong>Status:</strong> {{ report["new_status"] }}</p>
            <p><strong>Time:</strong> {{ report["created_at"] }}</p>

            <pre>{{ report["xml_data"] }}</pre>
        </div>
        {% else %}
        <p>No reports yet.</p>
        {% endfor %}
    </section>
</body>
</html>
